services:
  postgres:
    image: postgres:16-alpine
    container_name: cloud_sms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cloud_sms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cloud_sms"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloud_sms_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/cloud_sms
      # Local-only credentials for this compose stack; never reuse for a deployment
      JWT_SECRET: ${JWT_SECRET:-local-compose-development-super-secret-key-min-32}
      JWT_EXPIRES_IN: 24h
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
